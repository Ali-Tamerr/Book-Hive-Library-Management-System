<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookHive Library - Forgot Password</title>
  <link rel="stylesheet" href="../css/forgot-password.css">  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Caveat:wght@400;600&display=swap" rel="stylesheet">


</head>
<body>
  <div class="forgot-container">

    <!-- Left Section -->
    <div class="forgot-left">
      <img src="assets/logo.png" alt="BookHive Logo" class="logo">
      <h1>BookHive<br><span>Library</span></h1>
      <p>"Your premier digital library<br>for borrowing and reading books"</p>
    </div>

    <!-- Right Section -->
    <div class="forgot-right">
      <a href="login.html" class="back-btn">BACK</a>

      <div class="forgot-box">
        <img src="assets/logo.png" alt="BookHive Small Logo" class="small-logo">
        <h2>Forgot Password</h2>
        <p>Please enter your username</p>

        <form>
          <input type="text" placeholder="Username" required>
          <button type="submit">RESET PASSWORD</button>
        </form>
      </div>
    </div>

  </div>
</body>
</html>
