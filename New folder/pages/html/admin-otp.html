<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookHive Library - OTP Verification</title>
  <link rel="stylesheet" href="../css/otp.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Caveat:wght@400;600&display=swap" rel="stylesheet">

</head>
<body>
  <div class="otp-container">

    <!-- Left Section -->
    <div class="otp-left">
      <a href="forgot-password.html" class="back-btn">BACK</a>

      <div class="otp-box">
        <img src="assets/logo.png" alt="BookHive Small Logo" class="small-logo">
        <h2>Check your Mailbox</h2>
        <p>Please enter the OTP to proceed</p>

        <form>
          <input type="text" placeholder="OTP" required>
          <button type="submit">VERIFY</button>
        </form>
      </div>
    </div>

    <!-- Right Section -->
    <div class="otp-right">
      <img src="assets/logo.png" alt="BookHive Logo" class="logo">
      <h1>BookHive<br><span>Library</span></h1>
      <p>"Your premier digital library<br>for borrowing and reading books"</p>
    </div>

  </div>
</body>
</html>
