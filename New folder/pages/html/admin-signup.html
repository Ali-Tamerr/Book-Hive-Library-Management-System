<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookHive Library - Sign Up</title>
  <link rel="stylesheet" href="../css/signup.css" />
 <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Caveat:wght@400;600&display=swap" rel="stylesheet">

</head>
<body>
  <div class="signup-container">
    
    <!-- Left Section -->
    <div class="signup-left">
      <img src="assets/logo.png" alt="BookHive Logo" class="logo" />
      <h1>BookHive<br><span>Library</span></h1>
      <p>Already have Account? Sign In now.</p>
      <a href="signin.html" class="sign-in-btn">SIGN IN</a>
    </div>

    <!-- Right Section -->
    <div class="signup-right">
      <div class="signup-box">
        <img src="assets/logo.png" alt="Small Logo" class="small-logo" />
        <h2>Sign Up</h2>
        <p>Please provide your information to sign up.</p>

        <form>
          <div class="row">
            <input type="text" placeholder="First Name" required />
            <input type="text" placeholder="Last Name" required />
          </div>
          <div class="row">
            <input type="text" placeholder="Contact No" required />
            <input type="email" placeholder="Email" required />
          </div>
          <div class="row">
            <input type="text" placeholder="Username" required />
            <input type="password" placeholder="Password" required />
          </div>
          <button type="submit">SIGN UP</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
