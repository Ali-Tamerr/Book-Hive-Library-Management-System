<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Change Credentials PopUp</title>
  <link rel="stylesheet" href="../css user/dashboard-popup.css" />
  <script defer src="js/dashboard-user.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="overlay">
    <div class="popup">
      <h2>User Change Credentials PopUp</h2>

      <div class="header">
        <div class="icon-box">
          <span class="gear">⚙️</span>
          <h3>Change Credentials</h3>
        </div>
        <button id="closePopup" class="close-btn">×</button>
      </div>

      <div class="divider"></div>

      <form id="credentialsForm">
        <div class="input-group">
          <label for="currentPassword">Enter Current Password</label>
          <input type="password" id="currentPassword" placeholder="Enter Current Password" required />
        </div>

        <div class="input-group">
          <label for="newPassword">Enter New Password</label>
          <input type="password" id="newPassword" placeholder="Enter New Password" required />
        </div>

        <div class="input-group">
          <label for="confirmPassword">Confirm New Password</label>
          <input type="password" id="confirmPassword" placeholder="Confirm New Password" required />
        </div>

        <div class="button-group">
          <button type="button" id="cancelBtn" class="cancel">CANCEL</button>
          <button type="submit" class="confirm">CONFIRM</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
