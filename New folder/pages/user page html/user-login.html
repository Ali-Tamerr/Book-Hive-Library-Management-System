<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookHive Library - User Login</title>
  <link rel="stylesheet" href="../css user/user-login.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Caveat:wght@400;600&display=swap" rel="stylesheet">

</head>
<body>
  <div class="login-container">
    
    <!-- Left Side (Login Form) -->
    <div class="login-left">
      <div class="form-box">
        <h2>Welcome Back !!</h2>
        <p>Please enter your credentials to log in</p>

        <form>
          <input type="text" placeholder="Username" required>
          <input type="password" placeholder="Password" required>

          <a href="#" class="forgot">Forgot password?</a>
          <button type="submit">SIGN IN</button>
        </form>
      </div>
    </div>

    <!-- Right Side (Brand Section) -->
    <div class="login-right">
      <img src="/assets/images/Group Dark Logo.png" alt="BookHive Logo" class="logo">
      <h1>BookHive<br><span>Library</span></h1>
      <p>New to our platform? Sign Up now.</p>
      <button class="signup-btn">SIGN UP</button>
    </div>

  </div>
</body>
</html>
